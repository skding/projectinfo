services:
  app:
    container_name: project-record-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000" # Maps host port 3001 to container port 3000
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db-prod:5432/project_record_prod
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL} # e.g. http://your-instance-ip:3001
    depends_on:
      - db-prod
    networks:
      - project_net

  db-prod:
    container_name: project-record-db-prod
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_record_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - project_net

networks:
  project_net:
    driver: bridge

volumes:
  postgres_data_prod:
